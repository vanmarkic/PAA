version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: paa-postgres
    environment:
      POSTGRES_USER: paa_user
      POSTGRES_PASSWORD: paa_password
      POSTGRES_DB: paa_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paa_user']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paa-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: paa-redis
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paa-network

  # PAA API Server (optional - for development)
  # Uncomment to run API in Docker
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: paa-api
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     NODE_ENV: development
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_USERNAME: paa_user
  #     DB_PASSWORD: paa_password
  #     DB_NAME: paa_db
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     JWT_SECRET: dev-secret-change-in-production
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - paa-network
  #   volumes:
  #     - .:/app
  #     - /app/node_modules

  # PgAdmin (optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: paa-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@paa.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    networks:
      - paa-network

  # Redis Commander (optional - for Redis management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: paa-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis
    networks:
      - paa-network

volumes:
  postgres-data:
  redis-data:

networks:
  paa-network:
    driver: bridge
