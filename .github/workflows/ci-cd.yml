name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - 'claude/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Run tests and build
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run linter (if configured)
        run: npm run lint || echo "No linter configured"
        continue-on-error: true

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Generate documentation metadata
        run: npm run docs:metadata

      - name: Cache Astro dependencies
        uses: actions/cache@v4
        with:
          path: ./docs-astro/node_modules
          key: ${{ runner.os }}-astro-${{ hashFiles('docs-astro/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-astro-

      - name: Install Astro dependencies
        working-directory: ./docs-astro
        run: npm ci

      - name: Build Astro documentation site
        working-directory: ./docs-astro
        env:
          NODE_ENV: production
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            docs-astro/dist/
          retention-days: 1

      - name: Comment PR with test and build results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const jobName = 'Test & Build';
            const emoji = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';
            const comment = `${emoji} **${jobName}** - ${status.toUpperCase()}\n\nTests, linting, TypeScript build, and documentation metadata generation completed.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Job 2: Test Documentation with Playwright
  test-docs:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./artifacts

      - name: Copy built docs to expected location
        run: |
          mkdir -p docs-astro/dist
          cp -r artifacts/docs-astro/dist/* docs-astro/dist/ || echo "Build artifacts not found in expected location"

      - name: Install Astro dependencies (for preview server)
        working-directory: ./docs-astro
        run: npm ci

      - name: Run Playwright smoke tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4321
        run: npm run test:docs:smoke
        continue-on-error: true

      - name: Run Playwright visual regression tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4321
        run: npm run test:docs:visual
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots
          path: tests/e2e/docs/__snapshots__/
          retention-days: 7

      - name: Comment PR with documentation test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const jobName = 'Documentation Tests';
            const emoji = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';
            const comment = `${emoji} **${jobName}** - ${status.toUpperCase()}\n\nPlaywright smoke tests (non-blocking) and visual regression tests completed. Test reports available in artifacts.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Job 3: Deploy to GitHub Pages (only on master/main)
  deploy:
    needs: [test-and-build, test-docs]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./artifacts

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifacts/docs-astro/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
