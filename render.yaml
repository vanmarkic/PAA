services:
  # Existing Node.js app (PAA TypeScript backend)
  - type: web
    name: PAA-web
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets are added via dashboard (once, shared across projects)

  # New: PAA AI service (Python + FastAPI)
  - type: web
    name: paa-ai-api
    runtime: docker
    dockerfilePath: ai/Dockerfile
    dockerContext: ai
    plan: starter
    healthCheckPath: /health
    envVars:
      # NOTE: Render's free Postgres does NOT include pgvector. For the
      # deployed AI service, point DATABASE_URL at a Supabase or Neon
      # database (both free tiers ship pgvector). Local Docker continues to
      # use the pgvector/pgvector:pg16 image and works unchanged.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      # OpenAI is optional — only set if EMBEDDING_PROVIDER=openai is used.
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-4-20250514
      - key: EMBEDDING_PROVIDER
        value: voyage
      - key: EMBEDDING_MODEL
        value: voyage-3-large
      - key: EMBEDDING_DIM
        value: "1024"

databases:
  - name: PAA-db
    databaseName: PAA
    plan: starter  # $7/month, or 'free' for 90-day trial
    # Note: this Postgres is for the Node app's domain data only. The AI
    # service uses an external Supabase/Neon DB (see DATABASE_URL above).
